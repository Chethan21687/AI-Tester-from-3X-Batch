[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=output/report.html
    --self-contained-html
    --reruns=2
    --reruns-delay=1
markers =
    smoke: Smoke test suite
    regression: Regression test suite
    integration: Integration tests
    auth: Authentication tests
    patient: Patient management tests
    provider: Provider management tests
    appointment: Appointment booking tests
    disease: Disease management tests
    case_mgmt: Case management tests
    assessment: Assessment creation tests
log_cli = true
log_cli_level = INFO
log_file = logs/test_execution.log
log_file_level = DEBUG
log_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_date_format = %Y-%m-%dT%H:%M:%S
