[pytest]
# VWO E2E Test Suite — Playwright Python
# Run: pytest  (from Playwright_8_layer_architecture/)
# HTML report: pytest --html=test-results/report.html --self-contained-html

addopts =
    -v
    --tb=short
    --html=test-results/report.html
    --self-contained-html
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Retry flaky tests once before marking as failed
reruns = 1
reruns_delay = 2

markers =
    smoke:            Quick sanity checks — runs on every deploy
    regression:       Full regression suite — runs on release
    auth:             Authentication and session management tests
    ab_testing:       A/B Testing and SmartStats tests (FR1, FR2)
    insights:         Heatmaps and Session Recordings tests (FR4)
    reports:          Reporting and Dashboard tests (FR6)
    personalization:  Personalization campaign tests (FR7)
    integrations:     Third-party integration tests (FR8)
    nfr:              Non-functional requirements (performance, security)
    security:         Security-specific tests (RBAC, HTTPS, PII)
