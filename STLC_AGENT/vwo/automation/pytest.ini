[pytest]
addopts = -v --tb=short --browser chromium --html=reports/report.html --self-contained-html
testpaths = tests
markers =
    functional: functional test cases
    security: security and RBAC test cases
    accessibility: WCAG accessibility test cases
    regression: regression / critical-path suite
    smoke: critical-path smoke suite
    requires_auth: needs valid VWO credentials to run live
